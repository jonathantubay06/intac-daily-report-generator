services:
  - type: web
    name: intac-report-worker
    runtime: docker
    region: oregon
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    healthCheckPath: /health
    envVars:
      - key: CRM_URL
        value: https://crm.intacadvisory.com
      - key: CRM_USER
        sync: false
      - key: CRM_PASSWORD
        sync: false
      - key: TEAM_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAIL_FROM
        sync: false
