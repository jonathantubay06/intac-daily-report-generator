[build]
  publish = "frontend"
  command = ""
  # Skip the build unless a served file changed (worker/ and docs are not deployed here).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- frontend"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# config.js holds the auto-updated tunnel URL — must never be cached, or
# repeat visitors will keep calling yesterday's tunnel hostname.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
